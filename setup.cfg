[metadata]
name = grocery_pipeline
version = 0.1.0

[options]
packages = find:
python_requires = >=3.10,<3.14
install_requires =
    dagster>=1.9,<2
    dagster-webserver>=1.9,<2
    dbt-bigquery>=1.9,<2
    google-cloud-bigquery>=3.25,<4
    PyYAML>=6,<7
    requests>=2.32,<3

[options.packages.find]
include = grocery_pipeline*
exclude =
    grocery_pipeline_tests*
